name: Task
description: A unit of work that fits in one branch and one pull request.
labels: ["status:ready"]
body:
  - type: dropdown
    id: type
    attributes:
      label: Type
      options: [feature, chore, docs, spike]
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options: [editor, runtime, format, demo, tests, docs, deps]
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What this task delivers and why.
    validations:
      required: true
  - type: input
    id: spec
    attributes:
      label: Spec
      description: DESIGN.md sections this task implements, e.g. "§5.5 Box tool".
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkable conditions. The task is done when all pass and the PR is merged into main.
      value: |
        - [ ]
    validations:
      required: true
  - type: input
    id: depends
    attributes:
      label: Depends on
      description: Issues that must be closed first, e.g. "#3, #7". Leave empty if none.
